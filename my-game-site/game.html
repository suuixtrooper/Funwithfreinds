<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 0%, #1b2a5e, #0a0a1a 70%, #000);
  font-family:'MedievalSharp', cursive; overflow:hidden; }

#wrap { position:relative; }
canvas { display:block; border:4px solid #ffd700; border-radius:14px;
  box-shadow:0 0 40px rgba(255,215,0,.4); }

.overlay { position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  background:rgba(5,5,20,.75); backdrop-filter:blur(4px);
  border-radius:14px; }
.overlay h1 { font-family:'Orbitron', sans-serif; color:#ff3b3b; font-size:2.4rem;
  border:3px solid #ff3b3b; padding:14px 30px; border-radius:12px;
  animation:shake .4s infinite; text-shadow:0 0 20px #ff3b3b; }
@keyframes shake { 25%{transform:rotate(1.5deg);} 75%{transform:rotate(-1.5deg);} }
.overlay .score { color:#ffd700; font-size:1.5rem; }

.btn { font-family:'Orbitron', sans-serif; padding:12px 34px; font-size:1.05rem;
  border:2px solid #ffd700; border-radius:10px; cursor:pointer;
  background:linear-gradient(#2a1a4a,#141033); color:#ffd700; transition:.3s; }
.btn:hover { transform:scale(1.08); box-shadow:0 0 25px rgba(255,215,0,.7); }
.btn.home { border-color:#7df9ff; color:#7df9ff; }

#scoreHud { position:absolute; top:14px; left:50%; transform:translateX(-50%);
  font-family:'Orbitron', sans-serif; color:#fff; font-size:1.6rem;
  text-shadow:0 0 10px #000, 0 0 20px #ffd700; pointer-events:none; z-index:2; }

#clickToPlay { position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; cursor:pointer; z-index:3;
  font-family:'Orbitron', sans-serif; color:#ffd700; font-size:1.8rem;
  text-shadow:0 0 15px #000; animation:pulse 1.2s infinite; }
@keyframes pulse { 50%{opacity:.5;} }
.hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="420" height="620"></canvas>
  <div id="scoreHud">SCORE: 0</div>
  <div id="clickToPlay" class="hidden">CLICK TO PLAY</div>

  <div id="playScreen" class="overlay">
    <div class="score" id="finalScore"></div>
    <h1>YOU ARE DEAD</h1>
    <button class="btn" onclick="restart()">PLAY AGAIN</button>
    <button class="btn home" onclick="location.href='index.html'">HOME</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
