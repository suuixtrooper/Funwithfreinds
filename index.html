<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun with Friends</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+Malayalam:wght@600;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body { font-family:'Orbitron',sans-serif; overflow:hidden; height:100vh; }

/* ===== Animated RGB background ===== */
#bg { position:fixed; inset:0; background:linear-gradient(45deg,#0f0c29,#302b63,#24243e,#0f0c29);
  background-size:400% 400%; animation:bgmove 12s ease infinite; z-index:0; }
@keyframes bgmove { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

/* floating particles */
.particle { position:fixed; border-radius:50%; pointer-events:none; z-index:1;
  animation:float linear infinite; opacity:.6; }
@keyframes float { 0%{transform:translateY(110vh) scale(.5); opacity:0}
  10%{opacity:.7} 100%{transform:translateY(-10vh) scale(1.2); opacity:0} }

.screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
  justify-content:center; z-index:10; }
.screen.active { display:flex; }

/* neon glow title animation */
.neon-title { font-size:clamp(2rem,8vw,5rem); font-weight:900; text-align:center;
  background:linear-gradient(90deg,#ff00cc,#3333ff,#00ffcc,#ff00cc);
  background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
  color:transparent; animation:shine 4s linear infinite, pulse 2s ease-in-out infinite;
  filter:drop-shadow(0 0 15px rgba(255,0,204,.7)); }
@keyframes shine { to { background-position:300% 0 } }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

/* Language toggle */
.lang-switch { position:fixed; top:15px; right:15px; z-index:99; display:flex; gap:8px; }
.lang-btn { padding:8px 18px; border:2px solid #00ffcc; background:transparent; color:#00ffcc;
  font-family:'Orbitron'; font-weight:700; cursor:pointer; border-radius:20px; transition:.3s; }
.lang-btn.on { background:#00ffcc; color:#0f0c29; box-shadow:0 0 15px #00ffcc; }

/* Player select */
.choose-title { margin:20px 0 40px; }
.players { display:flex; gap:clamp(15px,5vw,60px); flex-wrap:wrap; justify-content:center; }
.player-card { cursor:pointer; text-align:center; transition:.3s; border-radius:25px; padding:20px; }
.player-card img { width:clamp(120px,30vw,220px); border-radius:50%; border:4px solid transparent;
  transition:.3s; animation:hover-float 3s ease-in-out infinite; }
@keyframes hover-float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.player-card:hover img, .player-card.selected img {
  border-color:#ff00cc; box-shadow:0 0 30px #ff00cc, 0 0 60px rgba(255,0,204,.4); transform:scale(1.08); }
.player-card .pname { margin-top:15px; font-weight:700; color:#fff; letter-spacing:2px;
  text-shadow:0 0 10px #00ffcc; }

/* Play button */
.play-btn { margin-top:50px; padding:18px 70px; font-size:1.6rem; font-weight:900;
  font-family:'Orbitron'; border:none; border-radius:50px; cursor:pointer; color:#fff;
  background:linear-gradient(90deg,#ff00cc,#7700ff); letter-spacing:3px; display:none;
  animation:btnpulse 1.5s infinite; box-shadow:0 0 25px #ff00cc; }
@keyframes btnpulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
.play-btn.show { display:block; }

/* Game screen */
#gameCanvas { position:fixed; inset:0; width:100vw; height:100vh; z-index:5; display:none; }

/* Game over modal */
.gameover-box { background:rgba(10,5,30,.92); border:3px solid; border-image:linear-gradient(90deg,#ff00cc,#00ffcc) 1;
  padding:45px 60px; border-radius:25px; text-align:center; box-shadow:0 0 60px rgba(255,0,204,.5);
  animation:popin .4s ease; display:none; z-index:50; position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%); }
@keyframes popin { from{transform:translate(-50%,-50%) scale(.5); opacity:0} }
.gameover-box.show { display:block; }
.gameover-box h2 { color:#fff; font-size:1.5rem; margin-bottom:25px;
  background:linear-gradient(90deg,#ff5555,#ff00cc); -webkit-background-clip:text; background-clip:text; color:transparent; }
.gameover-box .fscore { font-size:3rem; color:#00ffcc; text-shadow:0 0 20px #00ffcc; margin-bottom:30px; }
.gameover-box button { display:block; width:100%; margin:12px 0; padding:14px; font-family:'Orbitron';
  font-weight:700; font-size:1.1rem; border:none; border-radius:30px; cursor:pointer; transition:.3s; }
.btn-again { background:linear-gradient(90deg,#00ffcc,#00ccff); color:#000; }
.btn-home { background:transparent; border:2px solid #ff00cc !important; color:#ff00cc; }
button:hover { transform:scale(1.05); }

/* Score HUD */
#scoreHud { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:20;
  font-size:3rem; font-weight:900; color:#fff; text-shadow:0 0 20px #00ffcc; display:none; }
#clickPlay { position:fixed; top:55%; left:50%; transform:translateX(-50%); z-index:20;
  color:#fff; font-size:1.8rem; font-weight:700; display:none;
  text-shadow:0 0 15px #ff00cc; animation:blink 1s infinite; }
@keyframes blink { 50%{opacity:.2} }

.ml { font-family:'Noto Sans Malayalam','Orbitron',sans-serif; }
</style>
</head>
<body>
<div id="bg"></div>

<div class="lang-switch">
  <button class="lang-btn on" id="btnEn" onclick="setLang('en')">EN</button>
  <button class="lang-btn" id="btnMl" onclick="setLang('ml')">ML</button>
</div>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <h1 class="neon-title" id="titleText">Fun with Friends</h1>
</div>

<!-- SELECT -->
<div class="screen" id="selectScreen">
  <h1 class="neon-title choose-title" id="chooseText">Choose the person you want.</h1>
  <div class="players">
    <div class="player-card" onclick="selectPlayer(0)"><img src="assets/shadin.png"><div class="pname">Shadin</div></div>
    <div class="player-card" onclick="selectPlayer(1)"><img src="assets/ashmil.png"><div class="pname">Ashmil</div></div>
    <div class="player-card" onclick="selectPlayer(2)"><img src="assets/shifin.png"><div class="pname">Shifin</div></div>
  </div>
  <button class="play-btn" id="playBtn" onclick="startGame()">PLAY</button>
</div>

<canvas id="gameCanvas"></canvas>
<div id="scoreHud">0</div>
<div id="clickPlay">CLICK TO PLAY</div>

<!-- GAME OVER -->
<div class="gameover-box" id="overBox">
  <h2 id="overMsg">In this game, if you get out, you die.</h2>
  <div class="fscore" id="finalScore">0</div>
  <button class="btn-again" id="againBtn" onclick="restartGame()">PLAY AGAIN</button>
  <button class="btn-home" id="homeBtn" onclick="goHome()">HOME</button>
</div>

<script>
/* ================= i18n ================= */
const T = {
  en:{title:"Fun with Friends", choose:"Choose the person you want.", over:"In this game, if you get out, you die.",
      again:"PLAY AGAIN", home:"HOME", click:"CLICK TO PLAY"},
  ml:{title:"ഫൺ വിത്ത് ഫ്രണ്ട്സ്", choose:"ആരെയാണ് നീ തിരഞ്ഞെടുക്കുന്നത്?", over:"ഈ ഗെയിമിൽ നീ പുറത്തായാൽ ചത്തു കളയും!",
      again:"വീണ്ടും കളിക്കൂ", home:"ഹോം", click:"ക്ലിക്ക് ചെയ്യൂ, കളി തുടങ്ങാം!"}
};
let lang = "en";
function setLang(l){
  lang = l;
  document.getElementById('btnEn').classList.toggle('on', l==='en');
  document.getElementById('btnMl').classList.toggle('on', l==='ml');
  document.body.classList.toggle('ml', l==='ml');
  document.getElementById('titleText').textContent = T[l].title;
  document.getElementById('chooseText').textContent = T[l].choose;
  document.getElementById('overMsg').textContent = T[l].over;
  document.getElementById('againBtn').textContent = T[l].again;
  document.getElementById('homeBtn').textContent = T[l].home;
  document.getElementById('clickPlay').textContent = T[l].click;
}
setLang('en');

/* particles */
for(let i=0;i<40;i++){
  const p = document.createElement('div'); p.className='particle';
  const s = Math.random()*8+3;
  p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}vw;
    background:hsl(${Math.random()*360},100%,60%);
    animation-duration:${Math.random()*10+8}s; animation-delay:${Math.random()*10}s`;
  document.body.appendChild(p);
}

/* ================= Screens ================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ================= Player config ================= */
const players = [
  {head:"assets/shadinhead.png",  jump:"assets/shadinjump.mp3",  hit:["assets/shadinhit1.mp3","assets/shadinhit2.mp3"],
   bg:["#1a0533","#3d0a5c","#0a1a4d"], pipe:"#ff00cc", pipeGlow:"#ff77dd", sky1:"#12002b", sky2:"#2d0a4d"},
  {head:"assets/ashmilhead.png",  jump:"assets/ashmiljump.mp3",  hit:["assets/ashmilhit1.mp3","assets/ashmilhit2.mp3"],
   bg:["#00202e","#004455","#001a30"], pipe:"#00ffaa", pipeGlow:"#88ffd0", sky1:"#001520", sky2:"#003340"},
  {head:"assets/shifinhead.png",  jump:"assets/shifinjump.mp3",  hit:["assets/shifinhit1.mp3","assets/shifinhit2.mp3"],
   bg:["#330015","#5c0022","#1a0008"], pipe:"#ffaa00", pipeGlow:"#ffd880", sky1:"#1f0008", sky2:"#4d0a1a"}
];
let selected = -1;
function selectPlayer(i){
  selected = i;
  document.querySelectorAll('.player-card').forEach((c,j)=>c.classList.toggle('selected', j===i));
  document.getElementById('playBtn').classList.add('show');
}

/* ================= Game ================= */
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let W, H, headImg, bird, pipes, score, playing, started, frames, hitIdx, animId;
const jumpAud = new Audio(), hit1 = new Audio(), hit2 = new Audio();

function startGame(){
  const cfg = players[selected];
  jumpAud.src = cfg.jump; hit1.src = cfg.hit[0]; hit2.src = cfg.hit[1];
  headImg = new Image(); headImg.src = cfg.head;
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  bird = {x:W*0.22, y:H*0.4, vy:0, r:22, rot:0};
  pipes = []; score = 0; frames = 0; hitIdx = 0; started = false; playing = true;
  showScreen(''); document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  canvas.style.display='block';
  document.getElementById('scoreHud').style.display='block';
  document.getElementById('clickPlay').style.display='block';
  document.getElementById('overBox').classList.remove('show');
  document.getElementById('bg').style.background =
    `linear-gradient(45deg,${cfg.bg.join(',')},${cfg.bg[0]})`;
  document.getElementById('bg').style.backgroundSize = '400% 400%';
  spawnInitial();
  loop();
}
function spawnInitial(){ for(let i=0;i<3;i++) addPipe(W + i*(W*0.45)); }
function addPipe(x){
  const gap = H*0.28, pw = 70;
  const top = Math.random()*(H-gap-140)+60;
  pipes.push({x, w:pw, top, gap, passed:false});
}
function restartGame(){ startGame(); }
function goHome(){
  playing = false; cancelAnimationFrame(animId);
  canvas.style.display='none';
  document.getElementById('scoreHud').style.display='none';
  document.getElementById('clickPlay').style.display='none';
  document.getElementById('overBox').classList.remove('show');
  document.getElementById('bg').style.background='';
  setLang(lang); showScreen('homeScreen');
  setTimeout(()=>showScreen('selectScreen'), 0);
  // home -> then select; go straight to select:
  showScreen('selectScreen');
}

function flap(){
  if(!playing) return;
  if(!started){ started = true; document.getElementById('clickPlay').style.display='none'; }
  bird.vy = -9.5; bird.rot = -0.5;
  jumpAud.currentTime = 0; jumpAud.play().catch(()=>{});
}
canvas.addEventListener('click', flap);
document.addEventListener('keydown', e=>{ if(e.code==='Space') flap(); });

function die(){
  playing = false;
  const h = hitIdx%2===0 ? hit1 : hit2; hitIdx++;
  h.currentTime = 0; h.play().catch(()=>{});
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overBox').classList.add('show');
}

function loop(){
  if(!playing) return;
  const cfg = players[selected];
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,cfg.sky1); g.addColorStop(1,cfg.sky2);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<50;i++){
    const sx=(i*997)%W, sy=(i*613)%(H*0.7);
    ctx.globalAlpha = 0.3+0.5*Math.abs(Math.sin(frames*0.02+i));
    ctx.fillRect(sx,sy,2,2);
  }
  ctx.globalAlpha=1;

  if(started){
    bird.vy += 0.45; bird.y += bird.vy;
    bird.rot = Math.min(Math.max(bird.rot+0.05,-0.5),1.2);
    pipes.forEach(p=>p.x -= 4.5);
    if(pipes.length && pipes[pipes.length-1].x < W-W*0.45) addPipe(pipes[pipes.length-1].x + W*0.45);
    pipes = pipes.filter(p=>p.x+p.w>-10);
    // score
    pipes.forEach(p=>{
      if(!p.passed && p.x+p.w < bird.x-bird.r){ p.passed=true; score++;
        document.getElementById('scoreHud').textContent = score; }
    });
    // collision
    for(const p of pipes){
      if(bird.x+bird.r*0.7 > p.x && bird.x-bird.r*0.7 < p.x+p.w &&
         (bird.y-bird.r*0.7 < p.top || bird.y+bird.r*0.7 > p.top+p.gap)){ die(); return; }
    }
    if(bird.y+bird.r > H || bird.y-bird.r < 0){ die(); return; }
  } else {
    bird.y = H*0.4 + Math.sin(frames*0.08)*12; // idle hover
  }

  // pipes
  pipes.forEach(p=>{
    ctx.shadowColor = cfg.pipeGlow; ctx.shadowBlur = 20;
    ctx.fillStyle = cfg.pipe;
    ctx.fillRect(p.x,0,p.w,p.top);
    ctx.fillRect(p.x,p.top+p.gap,p.w,H-p.top-p.gap);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(p.x+8,0,10,p.top);
    ctx.fillRect(p.x+8,p.top+p.gap,10,H-p.top-p.gap);
  });

  // bird body
  ctx.save();
  ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot);
  // body circle
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 15;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  // wing (animated flap)
  const wing = Math.sin(frames*0.4)*8;
  ctx.fillStyle = '#ff00cc';
  ctx.beginPath(); ctx.ellipse(-4,4,10,5+wing*0.4, -0.4, 0, Math.PI*2); ctx.fill();
  // tail
  ctx.fillStyle='#ffaa00';
  ctx.beginPath(); ctx.moveTo(-bird.r,-2); ctx.lineTo(-bird.r-14,-8); ctx.lineTo(-bird.r-14,8); ctx.closePath(); ctx.fill();
  // head image clipped in circle (top half area of body)
  if(headImg.complete && headImg.naturalWidth){
    const d = bird.r*2;
    ctx.save();
    ctx.beginPath(); ctx.arc(0,-2,bird.r-1,0,Math.PI*2); ctx.clip();
    ctx.drawImage(headImg, -bird.r, -2-bird.r, d, d);
    ctx.restore();
  }
  ctx.restore();

  frames++;
  animId = requestAnimationFrame(loop);
}
</script>
</body>
</html>
