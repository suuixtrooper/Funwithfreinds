<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FUN WITH FRIENDS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d1f;color:#fff;text-align:center;touch-action:none}
#bgCanvas{position:fixed;inset:0;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;justify-content:center;align-items:center;padding:16px}
.screen.active{display:flex}

/* HOME */
#title{font-size:clamp(26px,7vw,50px);font-weight:900;letter-spacing:3px;color:#ffd93b;
  text-shadow:0 0 18px #ffd93b,3px 3px 0 #e94560;
  animation:titlePop .8s cubic-bezier(.2,1.6,.4,1),pulse 2.2s ease-in-out 1s infinite;margin-bottom:14px}
@keyframes titlePop{0%{transform:scale(0) rotate(-10deg);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#langBtns{display:flex;gap:14px;margin-bottom:20px}
button{cursor:pointer;border:none;border-radius:14px;font-weight:800;transition:.15s;font-family:inherit}
button:active{transform:scale(.94)}
.langBtn{background:linear-gradient(135deg,#e94560,#903749);color:#fff;font-size:16px;padding:11px 24px;
  box-shadow:0 4px 0 #7a1f3d;animation:riseIn .5s backwards}
.langBtn:nth-child(1){animation-delay:.2s}.langBtn:nth-child(2){animation-delay:.35s}
@keyframes riseIn{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
#chooseTxt{color:#7fdbff;font-size:clamp(14px,4vw,19px);margin-bottom:18px;animation:riseIn .5s .5s backwards}
.chooser{display:flex;gap:clamp(10px,4vw,24px)}
.circleWrap{width:clamp(80px,24vw,130px)}
.circle{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:4px solid rgba(255,255,255,.25);
  overflow:hidden;cursor:pointer;background:#1a1a2e;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:.3s}
.circle::after{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.5s infinite}
@keyframes shine{0%{left:-80%}50%,100%{left:130%}}
.circle img{width:100%;height:100%;object-fit:cover}
.circle.selected{border-color:#ffd93b;box-shadow:0 0 30px #ffd93b,0 0 60px rgba(255,217,59,.4);
  transform:scale(1.12);animation:selectBounce .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes selectBounce{0%{transform:scale(1)}40%{transform:scale(1.2)}70%{transform:scale(.95)}100%{transform:scale(1.12)}}
.circleWrap:nth-child(1){animation:fromLeft .7s cubic-bezier(.2,1.2,.4,1) .6s backwards}
.circleWrap:nth-child(2){animation:fromBottom .7s cubic-bezier(.2,1.2,.4,1) .75s backwards}
.circleWrap:nth-child(3){animation:fromRight .7s cubic-bezier(.2,1.2,.4,1) .9s backwards}
@keyframes fromLeft{0%{transform:translateX(-120vw) rotate(-360deg)}100%{transform:none}}
@keyframes fromRight{0%{transform:translateX(120vw) rotate(360deg)}100%{transform:none}}
@keyframes fromBottom{0%{transform:translateY(120vh)}100%{transform:none}}
.circleWrap p{margin-top:6px;color:#ffd93b;font-weight:bold;font-size:13px;text-shadow:0 2px 6px #000}
#playBtn{margin-top:20px;background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;
  font-size:clamp(17px,5vw,22px);padding:13px 52px;border-radius:30px;
  box-shadow:0 6px 0 #1e8449,0 10px 25px rgba(46,204,113,.4);display:none}
#playBtn.show{display:inline-block;animation:riseIn .5s}
#playBtn:hover{animation:wiggle .5s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}

/* GAME – full screen canvas */
#game{padding:0;justify-content:flex-start}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:10px;left:0;right:0;z-index:3;pointer-events:none}
.scoreBig{font-size:clamp(26px,7vw,38px);font-weight:900;color:#ffd93b;text-shadow:0 0 14px rgba(255,217,59,.7),2px 2px 0 #000;
  animation:scoreBump .3s}
@keyframes scoreBump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-10px,5px)}40%{transform:translate(10px,-5px)}60%{transform:translate(-7px,-4px)}80%{transform:translate(7px,4px)}}

/* START overlay */
#startOverlay{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;justify-content:center;align-items:center;
  background:rgba(0,0,0,.45)}
#startOverlay.show{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.tapRing{width:120px;height:120px;border-radius:50%;border:4px solid #ffd93b;display:flex;align-items:center;justify-content:center;
  animation:tapPulse 1.4s infinite;box-shadow:0 0 40px rgba(255,217,59,.5);font-size:52px}
@keyframes tapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#startTxt{margin-top:16px;font-size:clamp(18px,5vw,26px);font-weight:900;color:#fff;text-shadow:2px 2px 8px #000;
  animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:10}
.modalBox{background:linear-gradient(160deg,#1f2a4a,#12182e);border:3px solid #ffd93b;border-radius:22px;
  padding:26px 22px;max-width:min(420px,92vw);width:92vw;position:relative;top:50%;transform:translateY(-50%);
  box-shadow:0 0 60px rgba(255,217,59,.25);animation:popIn .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes popIn{0%{transform:translateY(-50%) scale(0) rotate(-8deg);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:1}}
.msg{font-size:16px;margin-bottom:12px;line-height:1.55;color:#ffe98a;min-height:52px}
.msg .cursor{display:inline-block;width:2px;height:1em;background:#ffd93b;animation:blink .7s infinite;vertical-align:-2px}
.killed{color:#ff4757;font-size:clamp(20px,6vw,26px);font-weight:900;margin-bottom:20px;
  animation:killedIn .6s .6s backwards;text-shadow:0 0 14px rgba(255,71,87,.6)}
@keyframes killedIn{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
.killed.ok{color:#2ecc71;text-shadow:0 0 14px rgba(46,204,113,.6)}
.btnRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.playAgain{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;padding:12px 26px;box-shadow:0 4px 0 #1e8449;animation:riseIn .4s .9s backwards}
.homeBtn{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;padding:12px 26px;box-shadow:0 4px 0 #91233c;animation:riseIn .4s 1s backwards}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- HOME -->
<div id="home" class="screen active">
  <h1 id="title">FUN WITH FRIENDS</h1>
  <div id="langBtns">
    <button class="langBtn" onclick="setLang('ml')">മലയാളം</button>
    <button class="langBtn" onclick="setLang('en')">English</button>
  </div>
  <h2 id="chooseTxt">Choose the person you want</h2>
  <div class="chooser">
    <div class="circleWrap"><div class="circle" data-id="shifin" onclick="pick(this)"><img src="shifin.png"></div><p>shifin</p></div>
    <div class="circleWrap"><div class="circle" data-id="shadin" onclick="pick(this)"><img src="shadin.png"></div><p>shadin</p></div>
    <div class="circleWrap"><div class="circle" data-id="ashmil" onclick="pick(this)"><img src="ashmil.png"></div><p>ashmil</p></div>
  </div>
  <button id="playBtn" onclick="enterGame()">▶ Play</button>
</div>

<!-- GAME (fullscreen canvas) -->
<div id="game" class="screen">
  <div id="hud"><div class="scoreBig" id="scoreTxt">102/0</div></div>
  <canvas id="cv"></canvas>
  <div id="startOverlay">
    <div class="tapRing">👆</div>
    <div id="startTxt">CLICK TO START</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <div class="msg"><span id="typed"></span><span class="cursor"></span></div>
    <div class="killed" id="modalKilled"></div>
    <div class="btnRow">
      <button class="playAgain" id="paBtn" onclick="playAgain()">Play Again</button>
      <button class="homeBtn" id="homeBtn2" onclick="goHome()">Home</button>
    </div>
  </div>
</div>

<script>
/* ================= LANGUAGE ================= */
const T={
 en:{title:"FUN WITH FRIENDS",choose:"Choose the person you want",play:"▶ Play",start:"CLICK TO START",
   nishad:"Nishad: Those 102 items are mine; are you trying to take them?",
   killedN:"Nishad killed you.",lost:"You have lost.",pa:"Play Again",home:"Home"},
 ml:{title:"ഫൺ വിത്ത് ഫ്രണ്ട്സ്",choose:"ആരെയാണ് തിരഞ്ഞെടുക്കേണ്ടത്?",play:"▶ കളിക്കുക",start:"ക്ലിക്ക് ചെയ്ത് സ്റ്റാർട്ട് ചെയ്യുക",
   nishad:"നിഷാദ്: ഈ 102 സാധനങ്ങൾ എന്റെതാണ്; നീ എടുക്കാൻ ശ്രമിക്കുകയാണോ?",
   killedN:"നിഷാദ് നിന്നെ കൊന്നു.",lost:"നീ തോറ്റു.",pa:"വീണ്ടും കളിക്കുക",home:"ഹോം"}
};
let lang="en";
function setLang(l){
  lang=l;const t=T[l];
  document.getElementById("title").textContent=t.title;
  document.getElementById("chooseTxt").textContent=t.choose;
  document.getElementById("playBtn").textContent=t.play;
  document.getElementById("startTxt").textContent=t.start;
  document.getElementById("paBtn").textContent=t.pa;
  document.getElementById("homeBtn2").textContent=t.home;
}
function pick(el){
  document.querySelectorAll(".circle").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");window.selected=el.dataset.id;
  document.getElementById("playBtn").classList.add("show");
}
function show(el,on){el.classList.toggle("active",on)}

/* ================= SOUND ================= */
function sfx(n){try{const a=new Audio(n);a.currentTime=0;a.play()}catch(e){}}

/* ================= BG PARTICLES ================= */
const bg=document.getElementById("bgCanvas"),bgx=bg.getContext("2d");
let parts=[];
function resizeBG(){bg.width=innerWidth;bg.height=innerHeight}
resizeBG();addEventListener("resize",resizeBG);
for(let i=0;i<45;i++)parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:1+Math.random()*3,s:.2+Math.random()*.8,c:["#ffd93b","#e94560","#7fdbff","#2ecc71"][Math.floor(Math.random()*4)]});
(function bgLoop(){
  bgx.clearRect(0,0,bg.width,bg.height);
  parts.forEach(p=>{p.y-=p.s;if(p.y<-10){p.y=bg.height+10;p.x=Math.random()*bg.width}
    bgx.globalAlpha=.5;bgx.fillStyle=p.c;bgx.beginPath();bgx.arc(p.x,p.y,p.r,0,7);bgx.fill()});
  bgx.globalAlpha=1;requestAnimationFrame(bgLoop);
})();

/* ================= GAME CANVAS – FULLSCREEN ================= */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,ground;
function resizeCv(){
  W=innerWidth;H=innerHeight;
  cv.width=W;cv.height=H;
  ground=Math.round(H*0.82);
}
const CFG={
  shifin:{head:"shifinhead.png",type:"flappy",jump:"shifinjump.mp3",scoreS:"shifinscore.mp3",hit:"shifinhit.mp3"},
  shadin:{head:"shadinhead.png",type:"dino",jump:"shadinjump.mp3",hit:"shadinhit.mp3"},
  ashmil:{head:"ashmilhead.png",type:"dino2",jump:"ashmiljump.mp3",hit:"shadinhit.mp3"}
};
const nishadImg=new Image();nishadImg.src="nishad1.png";
let headImg=new Image(),mode,score,target=102,running=false,raf,started=false;
let particles=[],explosion=null,clouds=[];

function enterGame(){ /* photo select → game screen + click-to-start */
  mode=CFG[window.selected];headImg=new Image();headImg.src=mode.head;
  resizeCv();resetWorld();
  show(document.getElementById("home"),false);
  show(document.getElementById("game"),true);
  document.getElementById("startOverlay").classList.add("show");
  started=false;running=true;
  updateScore();
  if(mode.type==="flappy")initFlappy();else initDino(mode.type==="dino2");
  cancelAnimationFrame(raf);loop(); /* render idle preview behind overlay */
}
function startNow(){ /* first tap = start */
  if(started)return;started=true;
  document.getElementById("startOverlay").classList.remove("show");
  doJump();
}
function resetWorld(){
  particles=[];explosion=null;
  clouds=[];for(let i=0;i<6;i++)clouds.push({x:Math.random()*W,y:H*.08+Math.random()*H*.35,s:.3+Math.random()*.6,w:50+Math.random()*70});
}
function playAgain(){
  document.getElementById("modal").style.display="none";
  resizeCv();resetWorld();updateScore();
  if(mode.type==="flappy")initFlappy();else initDino(mode.type==="dino2");
  document.getElementById("startOverlay").classList.add("show");
  started=false;running=true;loop();
}
function goHome(){
  running=false;cancelAnimationFrame(raf);
  document.getElementById("startOverlay").classList.remove("show");
  document.getElementById("modal").style.display="none";
  show(document.getElementById("game"),false);
  show(document.getElementById("home"),true);
}
function updateScore(){
  const el=document.getElementById("scoreTxt");
  el.textContent="102/"+Math.min(score,target);
  el.style.animation="none";void el.offsetWidth;el.style.animation="";
}
function burst(x,y,c,n,spd){
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*(spd||6),vy:(Math.random()-.5)*(spd||6)-2,
    life:30,r:2+Math.random()*3,c});
}
function shakeCv(){cv.classList.remove("shake");void cv.offsetWidth;cv.classList.add("shake")}
function startExplosion(x,y){ /* വെടി പൊട്ടൽ ആനിമേഷൻ */
  explosion={x,y,t:0};
  burst(x,y,"#ff4757",25,10);burst(x,y,"#ffd93b",15,8);burst(x,y,"#fff",10,7);
  sfx(mode.hit);shakeCv();
}
function endGame(byNishad,delay){
  running=false;cancelAnimationFrame(raf);
  setTimeout(()=>{
    const k=document.getElementById("modalKilled");
    k.textContent=byNishad?T[lang].killedN:T[lang].lost;
    k.classList.toggle("ok",!byNishad);
    const span=document.getElementById("typed");span.textContent="";
    const txt=T[lang].nishad;let i=0;
    const iv=setInterval(()=>{span.textContent=txt.slice(0,++i);if(i>=txt.length)clearInterval(iv)},35);
    document.getElementById("modal").style.display="block";
  },delay||600);
}

/* ================= FLAPPY (shifin) ================= */
let bird,pipes;
function initFlappy(){
  bird={x:W*.2,y:H*.4,v:0,r:34,rot:0};
  pipes=[];const gap=Math.max(150,H*.32),sp=Math.max(190,W*.45);
  for(let i=0;i<3;i++)pipes.push({x:W+i*sp+100,gap,y:H*.15+Math.random()*(H*.45),w:70,passed:false});
}
function drawFlappy(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#5ec4ff");g.addColorStop(1,"#c2e8ff");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  clouds.forEach(c=>{c.x-=c.s;if(c.x<-c.w)c.x=W+c.w;
    ctx.globalAlpha=.55;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*.6,18,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(c.x+c.w*.4,c.y+10,c.w*.4,13,0,0,7);ctx.fill();ctx.globalAlpha=1});
  if(started){
    bird.v+=0.5;bird.y+=bird.v;
    bird.rot=Math.max(-0.5,Math.min(1.2,bird.v/10));
    if(bird.y-bird.r<0){bird.y=bird.r;bird.v=0}
    if(bird.y+bird.r>ground){bird.y=ground-bird.r;startExplosion(bird.x,bird.y);endGame(false);return}
    for(const p of pipes){
      if(started)p.x-=4.5;
      if(p.x<-p.w-10){p.x+=3*(Math.max(190,W*.45));p.y=H*.15+Math.random()*(H*.45);p.passed=false}
      if(bird.x+bird.r*.8>p.x&&bird.x-bird.r*.8<p.x+p.w){
        if(bird.y-bird.r*.8<p.y||bird.y+bird.r*.8>p.y+p.gap){
          startExplosion(bird.x,bird.y);endGame(false);return}
      }
      if(!p.passed&&p.x+p.w<bird.x){
        p.passed=true;score+=10;sfx(mode.scoreS);updateScore();
        burst(p.x+p.w/2,p.y+p.gap/2,"#ffd93b",12);
        if(score>=target){/* nishad reaches */}
      }
      const pg=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
      pg.addColorStop(0,"#3fa33f");pg.addColorStop(.5,"#6dd36d");pg.addColorStop(1,"#2e7d32");
      ctx.fillStyle=pg;
      ctx.fillRect(p.x,0,p.w,p.y);ctx.fillRect(p.x,p.y+p.gap,p.w,ground-(p.y+p.gap));
      ctx.fillRect(p.x-6,p.y-24,p.w+12,24);ctx.fillRect(p.x-6,p.y+p.gap,p.w+12,24);
    }
    /* NISHAD at 100: വലത് വശത്ത് നിൽക്കുന്ന ബോർഡ് പോലെ, പറക്കുന്നില്ല */
    if(score>=target){
      const nx=W-90,ny=H*.35;
      const glow=.25+Math.sin(performance.now()/150)*.15;
      ctx.globalAlpha=glow;ctx.fillStyle="#ff4757";
      ctx.beginPath();ctx.arc(nx+35,ny+35,60,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.drawImage(nishadImg,nx,ny,70,58);
      ctx.font="bold 20px Arial";ctx.fillStyle="#c0392b";
      ctx.fillText("Nishad",nx+8,ny-10);
      if(bird.x+bird.r>nx&&bird.y+bird.r>ny&&bird.y-bird.r<ny+58){
        startExplosion(bird.x,bird.y);endGame(true);return}
    }
  }
  ctx.fillStyle="#8bc34a";ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle="#689f38";ctx.fillRect(0,ground,W,8);
  /* BIRD = CIRCLE with head photo clipped inside (flappy bird head style) */
  ctx.save();
  ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.beginPath();ctx.arc(0,0,bird.r,0,7);ctx.closePath();ctx.clip();
  ctx.drawImage(headImg,-bird.r,-bird.r,bird.r*2,bird.r*2);
  ctx.restore();
  /* outline */
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.beginPath();ctx.arc(0,0,bird.r,0,7);
  ctx.lineWidth=4;ctx.strokeStyle="#fff";ctx.stroke();ctx.restore();
}

/* ================= DINO (shadin / ashmil) – ഓടുന്ന ജീവി ================= */
let dino,obstacles,obTimer,nishadBird,darkBg,runPhase;
function initDino(v){
  darkBg=v;runPhase=0;obstacles=[];obTimer=0;nishadBird=null;
  dino={x:W*.12,y:ground-58,v:0,w:58,h:58,onGround:true};
}
function drawDino(){
  if(darkBg){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#2c3e50");g.addColorStop(1,"#141d2e");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#ffb86b");g.addColorStop(.6,"#ffe29a");g.addColorStop(1,"#ffd9a0");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    /* സൂര്യൻ */
    ctx.fillStyle="rgba(255,120,60,.6)";ctx.beginPath();ctx.arc(W*.85,H*.15,46,0,7);ctx.fill();
  }
  /* അകലെ മലകൾ (parallax) */
  ctx.fillStyle=darkBg?"#22334a":"rgba(200,120,60,.35)";
  const moff=(performance.now()/60)%W;
  for(let x=-moff;x<W;x+=W*.5){
    ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+W*.18,ground-H*.18);ctx.lineTo(x+W*.36,ground);ctx.fill();
  }
  clouds.forEach(c=>{c.x-=c.s*.6;if(c.x<-c.w)c.x=W+c.w;
    ctx.globalAlpha=darkBg?.15:.4;ctx.fillStyle="#fff";
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*.6,16,0,0,7);ctx.fill();ctx.globalAlpha=1});
  /* ground + stripes */
  ctx.fillStyle=darkBg?"#1a2537":"#c98f4e";ctx.fillRect(0,ground,W,H-ground);
  ctx.strokeStyle=darkBg?"rgba(255,255,255,.2)":"rgba(90,50,20,.35)";ctx.lineWidth=2;
  const off=(performance.now()/6)%40;
  for(let x=-off;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,ground+14);ctx.lineTo(x+16,ground+14);ctx.stroke()}
  if(started){
    dino.v+=0.9;dino.y+=dino.v;
    if(dino.y>ground-dino.h){dino.y=ground-dino.h;dino.v=0;dino.onGround=true}
    runPhase+=.3;
    obTimer++;
    if(obTimer>75){obTimer=0;obstacles.push({x:W+20,y:ground-56,w:36,h:56})}
    for(const o of obstacles){
      o.x-=6.5;
      if(dino.x+dino.w-6>o.x&&dino.x+6<o.x+o.w&&dino.y+dino.h-4>o.y+4){
        startExplosion(dino.x,dino.y);endGame(false);return}
      ctx.fillStyle=darkBg?"#c0392b":"#2e7d32";
      ctx.fillRect(o.x,o.y,o.w,o.h);
      ctx.fillRect(o.x-10,o.y+14,10,18);ctx.fillRect(o.x+o.w,o.y+8,10,16);
    }
    obstacles=obstacles.filter(o=>o.x>-60);
    /* NISHAD at 100: bird drawn with code + name on top (png വേണ്ട) */
    if(score>=target-10&&!nishadBird)nishadBird={x:W+80,y:H*.32,t:0};
    if(nishadBird){
      nishadBird.x-=5.5;nishadBird.t+=.3;
      const flap=Math.sin(nishadBird.t)*10;
      ctx.globalAlpha=.2+Math.sin(nishadBird.t*2)*.15;
      ctx.fillStyle="#ff4757";ctx.beginPath();ctx.arc(nishadBird.x+30,nishadBird.y+25,55,0,7);ctx.fill();
      ctx.globalAlpha=1;
      /* കോഡിൽ വരച്ച പക്ഷി */
      ctx.fillStyle="#8e44ad";
      ctx.beginPath();ctx.ellipse(nishadBird.x+30,nishadBird.y+25+flap*.2,32,22,0,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(nishadBird.x+56,nishadBird.y+12+flap*.2,13,0,7);ctx.fill();
      ctx.fillStyle="#2c3e50";
      ctx.beginPath();ctx.moveTo(nishadBird.x+10,nishadBird.y+25+flap*.2);
      ctx.lineTo(nishadBird.x-16,nishadBird.y+10+flap);
      ctx.lineTo(nishadBird.x-10,nishadBird.y+34+flap);ctx.fill();
      ctx.fillStyle="#ffd93b";/* കൊക്ക് */
      ctx.beginPath();ctx.moveTo(nishadBird.x+66,nishadBird.y+10+flap*.2);
      ctx.lineTo(nishadBird.x+80,nishadBird.y+15+flap*.2);
      ctx.lineTo(nishadBird.x+66,nishadBird.y+20+flap*.2);ctx.fill();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(nishadBird.x+60,nishadBird.y+8+flap*.2,4,0,7);ctx.fill();
      ctx.fillStyle="#000";ctx.beginPath();ctx.arc(nishadBird.x+61,nishadBird.y+8+flap*.2,2,0,7);ctx.fill();
      ctx.font="bold 18px Arial";ctx.fillStyle="#ff4757";
      ctx.fillText("Nishad",nishadBird.x+6,nishadBird.y-14);
      /* collision */
      if(dino.x+dino.w>nishadBird.x+4&&dino.x<nishadBird.x+66&&
         dino.y<nishadBird.y+45+flap*.2&&dino.y+dino.h>nishadBird.y+4+flap*.2){
        startExplosion(dino.x,dino.y);endGame(true);return}
    }
  }
  /* ജീവി (head png, run bounce) */
  const bob=dino.onGround?Math.abs(Math.sin(runPhase))*4:0;
  ctx.drawImage(headImg,dino.x,dino.y-bob,dino.w,dino.h);
}

/* ================= MAIN LOOP + EXPLOSION ================= */
function loop(){
  if(!running)return;
  ctx.clearRect(0,0,W,H);
  if(mode.type==="flappy")drawFlappy();else drawDino();
  /* particles */
  particles=particles.filter(p=>p.life-->0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;
    ctx.globalAlpha=p.life/30;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});
  ctx.globalAlpha=1;
  /* explosion ring ആനിമേഷൻ */
  if(explosion){
    explosion.t+=1;
    const e=explosion,rad=e.t*8;
    if(rad<Math.max(W,H)*.7){
      ctx.globalAlpha=1-e.t/25;
      ctx.strokeStyle="#ff4757";ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(e.x,e.y,rad,0,7);ctx.stroke();
      ctx.strokeStyle="#ffd93b";ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(e.x,e.y,rad*.6,0,7);ctx.stroke();
      ctx.globalAlpha=1;
    }else explosion=null;
  }
  raf=requestAnimationFrame(loop);
}

/* ================= INPUT ================= */
document.getElementById("startOverlay").addEventListener("click",startNow);
document.getElementById("startOverlay").addEventListener("touchstart",e=>{e.preventDefault();startNow()},{passive:false});
function doJump(){
  if(!running||!started)return;
  if(mode.type==="flappy"){bird.v=-8.5;burst(bird.x,bird.y+bird.r,"#fff",5,4);sfx(mode.jump)}
  else if(dino.onGround){dino.v=-16;dino.onGround=false;burst(dino.x+dino.w/2,ground,"#aaa",6,4);sfx(mode.jump)}
}
cv.addEventListener("pointerdown",e=>{e.preventDefault();doJump()});
document.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();
  if(!started){startNow()}else doJump()}});
addEventListener("resize",()=>{if(running){resizeCv();if(mode.type==="flappy")initFlappy();else initDino(darkBg)}});
</script>
