<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FUN WITH FRIENDS</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body { height:100%; overflow:hidden; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#0d0d1f; color:#fff; text-align:center; }

/* ===== particles bg ===== */
#bgCanvas { position:fixed; inset:0; z-index:0; }
.screen { position:relative; z-index:1; display:none; height:100%; flex-direction:column; justify-content:center; align-items:center; padding:16px; overflow:hidden; }
.screen.active { display:flex; }

/* ===== HOME ===== */
#title {
  font-size:clamp(28px,8vw,52px); font-weight:900; letter-spacing:3px;
  color:#ffd93b; text-shadow:0 0 18px #ffd93b,3px 3px 0 #e94560;
  animation:titlePop .8s cubic-bezier(.2,1.6,.4,1), pulse 2.2s ease-in-out 1s infinite;
  margin-bottom:18px;
}
@keyframes titlePop { 0%{transform:scale(0) rotate(-10deg);opacity:0} 100%{transform:scale(1) rotate(0);opacity:1} }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }

#langBtns { display:flex; gap:14px; margin-bottom:26px; }
button { cursor:pointer; border:none; border-radius:14px; font-weight:800; transition:.2s; font-family:inherit; }
button:active { transform:scale(.94); }
.langBtn {
  background:linear-gradient(135deg,#e94560,#903749); color:#fff; font-size:17px;
  padding:12px 26px; box-shadow:0 4px 0 #7a1f3d; animation:riseIn .5s backwards;
}
.langBtn:nth-child(1){ animation-delay:.2s } .langBtn:nth-child(2){ animation-delay:.35s }
@keyframes riseIn { 0%{transform:translateY(30px);opacity:0} 100%{transform:translateY(0);opacity:1} }

#chooseTxt { color:#7fdbff; font-size:clamp(15px,4vw,20px); margin-bottom:22px; animation:riseIn .5s .5s backwards; }

.chooser { display:flex; gap:clamp(10px,4vw,26px); flex-wrap:wrap; justify-content:center; }
.circleWrap { width:clamp(84px,26vw,140px); }
.circle {
  position:relative; width:100%; aspect-ratio:1; border-radius:50%;
  border:4px solid rgba(255,255,255,.25); overflow:hidden; cursor:pointer; background:#1a1a2e;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:transform .3s, box-shadow .3s, border-color .3s;
}
.circle::after { /* shine sweep */
  content:""; position:absolute; top:0; left:-80%; width:60%; height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shine 3.5s infinite;
}
@keyframes shine { 0%{left:-80%} 50%,100%{left:130%} }
.circle img { width:100%; height:100%; object-fit:cover; }
.circle.selected {
  border-color:#ffd93b; box-shadow:0 0 30px #ffd93b,0 0 60px rgba(255,217,59,.4);
  transform:scale(1.12); animation:selectBounce .5s cubic-bezier(.2,1.8,.4,1);
}
@keyframes selectBounce { 0%{transform:scale(1)} 40%{transform:scale(1.2)} 70%{transform:scale(.95)} 100%{transform:scale(1.12)} }
/* slide-in from sides */
.circleWrap:nth-child(1){ animation:fromLeft .7s cubic-bezier(.2,1.2,.4,1) .6s backwards; }
.circleWrap:nth-child(2){ animation:fromBottom .7s cubic-bezier(.2,1.2,.4,1) .75s backwards; }
.circleWrap:nth-child(3){ animation:fromRight .7s cubic-bezier(.2,1.2,.4,1) .9s backwards; }
@keyframes fromLeft  { 0%{transform:translateX(-120vw) rotate(-360deg)} 100%{transform:none} }
@keyframes fromRight { 0%{transform:translateX(120vw) rotate(360deg)}  100%{transform:none} }
@keyframes fromBottom{ 0%{transform:translateY(120vh)} 100%{transform:none} }
.circleWrap p { margin-top:8px; color:#ffd93b; font-weight:bold; font-size:14px; text-shadow:0 2px 6px #000; }

#playBtn {
  margin-top:26px; background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff;
  font-size:clamp(18px,5vw,24px); padding:14px 56px; border-radius:30px;
  box-shadow:0 6px 0 #1e8449,0 10px 25px rgba(46,204,113,.4);
  display:none; animation:riseIn .5s backwards;
}
#playBtn.show { display:inline-block; }
#playBtn:hover { animation:wiggle .5s; }
@keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg) scale(1.05)} 75%{transform:rotate(3deg) scale(1.05)} }

/* ===== GAME ===== */
#game { justify-content:flex-start; padding-top:8px; }
#hud { display:flex; gap:14px; align-items:center; justify-content:center; margin:6px 0; }
.scoreBig {
  font-size:clamp(24px,7vw,34px); font-weight:900; color:#ffd93b;
  text-shadow:0 0 12px rgba(255,217,59,.6); animation:scoreBump .3s;
}
@keyframes scoreBump { 0%{transform:scale(1.4)} 100%{transform:scale(1)} }
#hintTxt { color:rgba(255,255,255,.6); font-size:13px; margin-top:6px; animation:blink 1.6s infinite; }
@keyframes blink { 0%,100%{opacity:.9} 50%{opacity:.3} }
canvas { display:block; margin:4px auto; border-radius:14px; border:3px solid rgba(255,255,255,.15);
  box-shadow:0 0 40px rgba(0,0,0,.6); max-width:96vw; touch-action:none; }
canvas.shake { animation:shake .45s; }
@keyframes shake { 0%,100%{transform:translate(0)} 20%{transform:translate(-8px,4px)} 40%{transform:translate(8px,-4px)} 60%{transform:translate(-6px,-3px)} 80%{transform:translate(6px,3px)} }

/* ===== MODAL ===== */
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); backdrop-filter:blur(4px); z-index:10; }
.modalBox {
  background:linear-gradient(160deg,#1f2a4a,#12182e); border:3px solid #ffd93b; border-radius:22px;
  padding:26px 22px; max-width:min(420px,92vw); margin:auto; margin-top:0; position:relative;
  top:50%; transform:translateY(-50%);
  box-shadow:0 0 60px rgba(255,217,59,.25);
  animation:popIn .55s cubic-bezier(.2,1.7,.4,1);
}
@keyframes popIn { 0%{transform:translateY(-50%) scale(0) rotate(-8deg);opacity:0} 100%{transform:translateY(-50%) scale(1) rotate(0);opacity:1} }
.msg { font-size:17px; margin-bottom:12px; line-height:1.55; color:#ffe98a; min-height:48px; }
.msg .cursor { display:inline-block; width:2px; height:1em; background:#ffd93b; animation:blink .7s infinite; vertical-align:-2px; }
.killed { color:#ff4757; font-size:clamp(20px,6vw,26px); font-weight:900; margin-bottom:20px; animation:killedIn .6s .6s backwards; text-shadow:0 0 14px rgba(255,71,87,.6); }
@keyframes killedIn { 0%{transform:scale(3);opacity:0} 100%{transform:scale(1);opacity:1} }
.killed.ok { color:#2ecc71; text-shadow:0 0 14px rgba(46,204,113,.6); }
.btnRow { display:flex; gap:14px; justify-content:center; }
.playAgain { background:linear-gradient(135deg,#2ecc71,#27ae60); color:#fff; padding:12px 26px; box-shadow:0 4px 0 #1e8449; animation:riseIn .4s .9s backwards; }
.homeBtn { background:linear-gradient(135deg,#e94560,#c23152); color:#fff; padding:12px 26px; box-shadow:0 4px 0 #91233c; animation:riseIn .4s 1s backwards; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- HOME -->
<div id="home" class="screen active">
  <h1 id="title">FUN WITH FRIENDS</h1>
  <div id="langBtns">
    <button class="langBtn" onclick="setLang('ml')">മലയാളം</button>
    <button class="langBtn" onclick="setLang('en')">English</button>
  </div>
  <h2 id="chooseTxt">Choose the person you want</h2>
  <div class="chooser">
    <div class="circleWrap">
      <div class="circle" data-id="shifin" onclick="pick(this)"><img src="shifin.png" alt=""></div>
      <p>shifin</p>
    </div>
    <div class="circleWrap">
      <div class="circle" data-id="shadin" onclick="pick(this)"><img src="shadin.png" alt=""></div>
      <p>shadin</p>
    </div>
    <div class="circleWrap">
      <div class="circle" data-id="ashmil" onclick="pick(this)"><img src="ashmil.png" alt=""></div>
      <p>ashmil</p>
    </div>
  </div>
  <button id="playBtn" onclick="startGame()">▶ Play</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="hud"><div class="scoreBig" id="scoreTxt">102/0</div></div>
  <canvas id="cv" width="420" height="520"></canvas>
  <div id="hintTxt">Tap / Press SPACE to jump</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <div class="msg"><span id="typed"></span><span class="cursor"></span></div>
    <div class="killed" id="modalKilled"></div>
    <div class="btnRow">
      <button class="playAgain" id="paBtn" onclick="playAgain()">Play Again</button>
      <button class="homeBtn" id="homeBtn2" onclick="goHome()">Home</button>
    </div>
  </div>
</div>

<script>
/* ================= LANGUAGE ================= */
const T = {
  en:{ title:"FUN WITH FRIENDS", choose:"Choose the person you want", play:"▶ Play",
    nishad:"Nishad: Those 102 items are mine; are you trying to take them?",
    killedN:"Nishad killed you.", lost:"You have lost.",
    pa:"Play Again", home:"Home", tap:"Tap / Press SPACE to jump" },
  ml:{ title:"ഫൺ വിത്ത് ഫ്രണ്ട്സ്", choose:"ആരെയാണ് തിരഞ്ഞെടുക്കേണ്ടത്?", play:"▶ കളിക്കുക",
    nishad:"നിഷാദ്: ഈ 102 സാധനങ്ങൾ എന്റെതാണ്; നീ എടുക്കാൻ ശ്രമിക്കുകയാണോ?",
    killedN:"നിഷാദ് നിന്നെ കൊന്നു.", lost:"നീ തോറ്റു.",
    pa:"വീണ്ടും കളിക്കുക", home:"ഹോം", tap:"ടാപ്പ് ചെയ്യുക / SPACE അമർത്തി ചാടുക" }
};
let lang="en";
function setLang(l){
  lang=l; const t=T[l];
  document.getElementById("title").textContent=t.title;
  document.getElementById("chooseTxt").textContent=t.choose;
  document.getElementById("playBtn").textContent=t.play;
  document.getElementById("paBtn").textContent=t.pa;
  document.getElementById("homeBtn2").textContent=t.home;
  document.getElementById("hintTxt").textContent=t.tap;
}
function pick(el){
  document.querySelectorAll(".circle").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");
  window.selected=el.dataset.id;
  document.getElementById("playBtn").classList.add("show");
}
function show(el,on){ el.classList.toggle("active",on); }
function goHome(){
  show(document.getElementById("game"),false); show(document.getElementById("home"),true);
  document.getElementById("modal").style.display="none";
  running=false; cancelAnimationFrame(raf);
}
function playAgain(){ document.getElementById("modal").style.display="none"; startGame(); }

/* ================= SOUND ================= */
function sfx(n){ try{ const a=new Audio(n); a.currentTime=0; a.play(); }catch(e){} }

/* ================= BG PARTICLES (home) ================= */
const bg=document.getElementById("bgCanvas"), bgx=bg.getContext("2d");
let parts=[];
function resizeBG(){ bg.width=innerWidth; bg.height=innerHeight; }
resizeBG(); addEventListener("resize",resizeBG);
for(let i=0;i<45;i++) parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:1+Math.random()*3,s:.2+Math.random()*.8,c:["#ffd93b","#e94560","#7fdbff","#2ecc71"][Math.floor(Math.random()*4)]});
(function bgLoop(){
  bgx.clearRect(0,0,bg.width,bg.height);
  parts.forEach(p=>{ p.y-=p.s; if(p.y<-10){p.y=bg.height+10;p.x=Math.random()*bg.width;}
    bgx.globalAlpha=.5; bgx.fillStyle=p.c; bgx.beginPath(); bgx.arc(p.x,p.y,p.r,0,7); bgx.fill(); });
  bgx.globalAlpha=1;
  requestAnimationFrame(bgLoop);
})();

/* ================= GAME SETUP ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const W=420,H=520,ground=470;
let raf,running=false,mode,score,target=102;
const CFG={
  shifin:{head:"shifinhead.png",type:"flappy",jump:"shifinjump.mp3",scoreS:"shifinscore.mp3",hit:"shifinhit.mp3"},
  shadin:{head:"shadinhead.png",type:"dino",jump:"shadinjump.mp3",hit:"shadinhit.mp3"},
  ashmil:{head:"ashmilhead.png",type:"dino2",jump:"ashmiljump.mp3",hit:"shadinhit.mp3"}
};
const nishadImg=new Image(); nishadImg.src="nishad1.png";
let headImg=new Image(), particles=[], clouds=[];
for(let i=0;i<5;i++) clouds.push({x:Math.random()*W,y:30+Math.random()*180,s:.3+Math.random()*.5,w:50+Math.random()*60});

function startGame(){
  mode=CFG[window.selected]; headImg=new Image(); headImg.src=mode.head;
  score=0; running=true; particles=[];
  show(document.getElementById("home"),false); show(document.getElementById("game"),true);
  updateScore();
  if(mode.type==="flappy") initFlappy(); else initDino(mode.type==="dino2");
  loop();
}
function updateScore(){
  const el=document.getElementById("scoreTxt");
  el.textContent="102/"+Math.min(score,target);
  el.style.animation="none"; void el.offsetWidth; el.style.animation="";
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-2,
    life:30,r:2+Math.random()*3,c:color});
}
function shakeCv(){ cv.classList.remove("shake"); void cv.offsetWidth; cv.classList.add("shake"); }

function gameOver(byNishad){
  if(!running) return; running=false; cancelAnimationFrame(raf); shakeCv();
  const k=document.getElementById("modalKilled");
  k.textContent=byNishad?T[lang].killedN:T[lang].lost;
  k.classList.toggle("ok",!byNishad);
  /* typing effect */
  const span=document.getElementById("typed"); span.textContent="";
  const txt=T[lang].nishad; let i=0;
  const iv=setInterval(()=>{ span.textContent=txt.slice(0,++i); if(i>=txt.length) clearInterval(iv); },35);
  document.getElementById("modal").style.display="block";
}

/* ================= FLAPPY (shifin) ================= */
let bird,pipes;
function initFlappy(){
  bird={x:80,y:200,v:0,w:52,h:42,rot:0}; pipes=[]; clouds.forEach(c=>c.x=Math.random()*W);
  for(let i=0;i<3;i++) pipes.push({x:W+i*200,gap:150,y:90+Math.random()*200,passed:false});
}
function die(){ sfx(mode.hit); burst(bird?bird.x:dino.x, bird?bird.y:dino.y,"#ff4757",18); gameOver(false); }
function win(){
  running=false; cancelAnimationFrame(raf); shakeCv();
  const k=document.getElementById("modalKilled");
  k.textContent=T[lang].killedN; k.classList.remove("ok");
  const span=document.getElementById("typed"); span.textContent="";
  const txt=T[lang].nishad; let i=0;
  const iv=setInterval(()=>{ span.textContent=txt.slice(0,++i); if(i>=txt.length) clearInterval(iv); },35);
  document.getElementById("modal").style.display="block";
}
function loop(){
  if(!running) return;
  ctx.clearRect(0,0,W,H);
  if(mode.type==="flappy") drawFlappy(); else drawDino();
  /* particles */
  particles=particles.filter(p=>p.life-->0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.2;
    ctx.globalAlpha=p.life/30; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); });
  ctx.globalAlpha=1;
  raf=requestAnimationFrame(loop);
}
function drawClouds(){
  clouds.forEach(c=>{ c.x-=c.s; if(c.x<-c.w) c.x=W+c.w;
    ctx.globalAlpha=.5; ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w*.6,16,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(c.x+c.w*.4,c.y+8,c.w*.4,12,0,0,7); ctx.fill();
    ctx.globalAlpha=1; });
}
function drawFlappy(){
  /* sky gradient */
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#6ec6ff"); g.addColorStop(1,"#b3e5fc");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawClouds();
  bird.v+=.45; bird.y+=bird.v;
  bird.rot=Math.max(-0.5,Math.min(1,bird.v/10));
  if(bird.y<0){bird.y=0;bird.v=0;}
  if(bird.y+bird.h>ground){ burst(bird.x,ground,"#8b5a2b",15); die(); return; }
  for(const p of pipes){
    p.x-=3;
    if(p.x<-70){ p.x+=600; p.y=90+Math.random()*200; p.passed=false; }
    if(bird.x+bird.w>p.x && bird.x<p.x+60){
      if(bird.y<p.y||bird.y+bird.h>p.y+p.gap){ burst(bird.x,bird.y,"#ff4757",18); die(); return; }
    }
    if(!p.passed && p.x+60<bird.x){
      p.passed=true; score+=10; sfx(mode.scoreS); updateScore(); burst(p.x+30,p.y+p.gap/2,"#ffd93b",12);
      if(score>=target){ win(); return; }
    }
    /* pipe with cap */
    const pg=ctx.createLinearGradient(p.x,0,p.x+60,0); pg.addColorStop(0,"#3fa33f"); pg.addColorStop(.5,"#6dd36d"); pg.addColorStop(1,"#2e7d32");
    ctx.fillStyle=pg;
    ctx.fillRect(p.x,0,60,p.y); ctx.fillRect(p.x,p.y+p.gap,60,ground-(p.y+p.gap));
    ctx.fillRect(p.x-5,p.y-22,70,22); ctx.fillRect(p.x-5,p.y+p.gap,70,22);
  }
  ctx.fillStyle="#8bc34a"; ctx.fillRect(0,ground,W,H-ground);
  ctx.fillStyle="#689f38"; ctx.fillRect(0,ground,W,8);
  /* bird with rotation */
  ctx.save(); ctx.translate(bird.x+bird.w/2,bird.y+bird.h/2); ctx.rotate(bird.rot);
  ctx.drawImage(headImg,-bird.w/2,-bird.h/2,bird.w,bird.h); ctx.restore();
}

/* ================= DINO (shadin / ashmil) ================= */
let dino,obstacles,obTimer,nishadBird,darkBg,runPhase;
function initDino(v){
  dino={x:50,y:390,v:0,w:58,h:58,onGround:true};
  obstacles=[]; obTimer=0; nishadBird=null; darkBg=v; runPhase=0;
}
function drawDino(){
  if(darkBg){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#2c3e50"); g.addColorStop(1,"#1a2537");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#fdf6e3"); g.addColorStop(1,"#e8d9b5");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  drawClouds();
  /* ground + moving stripes */
  ctx.fillStyle=darkBg?"#1a2537":"#d7c9a3"; ctx.fillRect(0,ground,W,H-ground);
  ctx.strokeStyle=darkBg?"rgba(255,255,255,.2)":"rgba(0,0,0,.2)"; ctx.lineWidth=2;
  const off=(performance.now()/6)%40;
  for(let x=-off;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,ground+12); ctx.lineTo(x+14,ground+12); ctx.stroke(); }
  /* physics */
  dino.v+=0.9; dino.y+=dino.v;
  if(dino.y>390){ dino.y=390; dino.v=0; dino.onGround=true; }
  runPhase+=.3;
  /* obstacles (cacti with spikes) */
  obTimer++;
  if(obTimer>80){ obTimer=0; obstacles.push({x:W+20,y:ground-52,w:34,h:52}); }
  for(const o of obstacles){
    o.x-=6.5;
    if(dino.x+dino.w>o.x+4 && dino.x<o.x+o.w-4 && dino.y+dino.h>o.y+4){
      burst(dino.x,dino.y,"#ff4757",18); die(); return; }
    ctx.fillStyle=darkBg?"#c0392b":"#2e7d32";
    ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillRect(o.x-10,o.y+12,10,18); ctx.fillRect(o.x+o.w,o.y+6,10,16);
  }
  obstacles=obstacles.filter(o=>o.x>-60);
  /* nishad bird at 100 */
  if(score>=target-10 && !nishadBird) nishadBird={x:W+60,y:260,t:0};
  if(nishadBird){
    nishadBird.x-=5.5; nishadBird.t+=.3;
    const flap=Math.sin(nishadBird.t)*8;
    /* warning glow */
    ctx.globalAlpha=.25+Math.sin(nishadBird.t*2)*.15;
    ctx.fillStyle="#ff4757"; ctx.beginPath(); ctx.arc(nishadBird.x+27,nishadBird.y+22,45,0,7); ctx.fill();
    ctx.globalAlpha=1;
    ctx.drawImage(nishadImg,nishadBird.x,nishadBird.y+flap*.3,56,46);
    ctx.font="bold 15px Arial"; ctx.fillStyle=darkBg?"#ff6b6b":"#c0392b";
    ctx.fillText("Nishad",nishadBird.x+10,nishadBird.y-8);
    if(dino.x+dino.w>nishadBird.x+8 && dino.x<nishadBird.x+48 &&
       dino.y<nishadBird.y+42+flap*.3 && dino.y+dino.h>nishadBird.y+flap*.3){
      burst(dino.x,dino.y,"#ff4757",20); sfx(mode.hit); gameOver(true); return; }
  }
  /* dino run bounce + slight squash when jumping */
  const bob=dino.onGround?Math.abs(Math.sin(runPhase))*4:0;
  ctx.drawImage(headImg,dino.x,dino.y-bob,dino.w,dino.h);
}

/* ================= INPUT ================= */
function doJump(){
  if(!running) return;
  if(mode.type==="flappy"){ bird.v=-8.5; burst(bird.x,bird.y+bird.h/2,"#fff",5); sfx(mode.jump); }
  else if(dino.onGround){ dino.v=-15.5; dino.onGround=false; burst(dino.x+dino.w/2,ground,"#aaa",6); sfx(mode.jump); }
}
document.addEventListener("keydown",e=>{ if(e.code==="Space"){e.preventDefault();doJump();} });
cv.addEventListener("mousedown",doJump);
cv.addEventListener("touchstart",e=>{e.preventDefault();doJump();},{passive:false});
</script>
</body>
</html>
