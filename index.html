<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUN WITH FRIENDS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
body { background: linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; min-height:100vh; text-align:center; }
.screen { display:none; padding:20px; min-height:100vh; }
.screen.active { display:block; }
h1.big { font-size:48px; margin-top:40px; color:#ffd93b; text-shadow:3px 3px 0 #e94560; letter-spacing:2px; }
h2 { margin:20px 0; color:#ffd93b; }
#langBtns { margin-top:30px; display:flex; gap:20px; justify-content:center; }
button { cursor:pointer; border:none; border-radius:12px; padding:12px 28px; font-size:18px; font-weight:bold; transition:0.2s; }
button:hover { transform:scale(1.05); }
.langBtn { background:#e94560; color:#fff; font-size:22px; padding:16px 40px; }
.chooser { display:flex; gap:30px; justify-content:center; margin-top:30px; flex-wrap:wrap; }
.circleWrap { width:150px; }
.circle { position:relative; width:150px; height:150px; border-radius:50%; border:5px solid #444; overflow:hidden; cursor:pointer; transition:0.2s; background:#222; }
.circle img { width:100%; height:100%; object-fit:cover; }
.circle.selected { border-color:#ffd93b; box-shadow:0 0 25px #ffd93b; transform:scale(1.08); }
.circleWrap p { margin-top:8px; color:#ffd93b; font-weight:bold; }
#playBtn { background:#4caf50; color:#fff; font-size:22px; padding:16px 60px; margin-top:40px; display:none; }
canvas { background:#87ceeb; border:4px solid #222; border-radius:8px; display:block; margin:15px auto; touch-action:none; }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10; }
.modalBox { background:#16213e; border:3px solid #ffd93b; border-radius:16px; padding:30px; max-width:420px; margin:15vh auto; }
.modalBox .msg { font-size:20px; margin-bottom:15px; line-height:1.5; }
.modalBox .killed { color:#ff4757; font-size:24px; font-weight:bold; margin-bottom:20px; }
.btnRow { display:flex; gap:15px; justify-content:center; }
.playAgain { background:#4caf50; color:#fff; }
.homeBtn { background:#e94560; color:#fff; }
.scoreBig { font-size:34px; color:#ffd93b; font-weight:bold; margin:10px 0; }
.hint { color:#ccc; margin-top:10px; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <h1 class="big" id="titleTxt">FUN WITH FRIENDS</h1>
  <div id="langBtns">
    <button class="langBtn" onclick="setLang('ml')">മലയാളം</button>
    <button class="langBtn" onclick="setLang('en')">English</button>
  </div>
  <h2 id="chooseTxt">Choose the person you want</h2>
  <div class="chooser">
    <div class="circleWrap">
      <div class="circle" data-id="shifin" onclick="pick(this)"><img src="shifin.png" alt="shifin"></div>
      <p>shifin</p>
    </div>
    <div class="circleWrap">
      <div class="circle" data-id="shadin" onclick="pick(this)"><img src="shadin.png" alt="shadin"></div>
      <p>shadin</p>
    </div>
    <div class="circleWrap">
      <div class="circle" data-id="ashmil" onclick="pick(this)"><img src="ashmil.png" alt="ashmil"></div>
      <p>ashmil</p>
    </div>
  </div>
  <button id="playBtn" onclick="startGame()">▶ Play</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="scoreBig" id="scoreTxt">102/0</div>
  <canvas id="cv" width="420" height="480"></canvas>
  <div class="hint" id="hintTxt">Tap / Press SPACE to jump</div>
</div>

<!-- GAME OVER MODAL -->
<div class="modal" id="modal">
  <div class="modalBox">
    <div class="msg" id="modalMsg"></div>
    <div class="killed" id="modalKilled"></div>
    <div class="btnRow">
      <button class="playAgain" id="paBtn" onclick="playAgain()">Play Again</button>
      <button class="homeBtn" id="homeBtn2" onclick="goHome()">Home</button>
    </div>
  </div>
</div>

<script>
/* ================= LANGUAGE ================= */
const T = {
  en: {
    title:"FUN WITH FRIENDS",
    choose:"Choose the person you want",
    play:"▶ Play",
    nishad:"Nishad: Those 102 items are mine; are you trying to take them?",
    killedN:"Nishad killed you.",
    lost:"You have lost.",
    pa:"Play Again",
    home:"Home",
    tap:"Tap / Press SPACE to jump"
  },
  ml: {
    title:"ഫൺ വിത്ത് ഫ്രണ്ട്സ്",
    choose:"ആരെയാണ് തിരഞ്ഞെടുക്കേണ്ടത്?",
    play:"▶ കളിക്കുക",
    nishad:"നിഷാദ്: ഈ 102 സാധനങ്ങൾ എന്റെതാണ്; നീ എടുക്കാൻ ശ്രമിക്കുകയാണോ?",
    killedN:"നിഷാദ് നിന്നെ കൊന്നു.",
    lost:"നീ തോറ്റു.",
    pa:"വീണ്ടും കളിക്കുക",
    home:"ഹോം",
    tap:"ടാപ്പ് ചെയ്യുക / SPACE അമർത്തി ചാടുക"
  }
};
let lang = "en";
function setLang(l){
  lang = l;
  document.getElementById("titleTxt").textContent = T[l].title;
  document.getElementById("chooseTxt").textContent = T[l].choose;
  document.getElementById("playBtn").textContent = T[l].play;
  document.getElementById("paBtn").textContent = T[l].pa;
  document.getElementById("homeBtn2").textContent = T[l].home;
  document.getElementById("hintTxt").textContent = T[l].tap;
}

function pick(el){
  document.querySelectorAll(".circle").forEach(c=>c.classList.remove("selected"));
  el.classList.add("selected");
  window.selected = el.dataset.id;
  document.getElementById("playBtn").style.display = "inline-block";
}

function show(el, on){ el.classList.toggle("active", on); }

function goHome(){
  show(document.getElementById("game"), false);
  show(document.getElementById("home"), true);
  document.getElementById("modal").style.display = "none";
  running = false;
  cancelAnimationFrame(raf);
}
function playAgain(){
  document.getElementById("modal").style.display = "none";
  startGame();
}

/* ================= SOUND ================= */
function sfx(name){ try{ const a = new Audio(name); a.currentTime=0; a.play(); }catch(e){} }

/* ================= GAME SETUP ================= */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let raf, running = false, mode, score, target = 102;

/* Sound configuration:
   - shifin (flappy): shifinjump.mp3 on jump, shifinscore.mp3 on each pipe point, shifinhit.mp3 on hit
   - shadin (dino):   shadinjump.mp3 on jump, shadinhit.mp3 on hit (no score sound)
   - ashmil (dino):   ashmiljump.mp3 on jump, shadinhit.mp3 on hit (no score sound)
*/
const CFG = {
  shifin: { head:"shifinhead.png",  type:"flappy",
            jump:"shifinjump.mp3",  scoreS:"shifinscore.mp3", hit:"shifinhit.mp3" },
  shadin: { head:"shadinhead.png",  type:"dino",
            jump:"shadinjump.mp3",  hit:"shadinhit.mp3" },
  ashmil: { head:"ashmilhead.png",  type:"dino2",
            jump:"ashmiljump.mp3",  hit:"shadinhit.mp3" }
};
const nishadImg = new Image(); nishadImg.src = "nishad1.png";
let headImg = new Image();

function startGame(){
  const c = CFG[window.selected];
  mode = c; headImg = new Image(); headImg.src = c.head;
  score = 0; running = true;
  show(document.getElementById("home"), false);
  show(document.getElementById("game"), true);
  updateScore();
  if(c.type === "flappy") initFlappy(); else initDino(c.type === "dino2");
  loop();
}
function updateScore(){ document.getElementById("scoreTxt").textContent = "102/" + Math.min(score, target); }

function gameOver(byNishad){
  if(!running) return; running = false;
  cancelAnimationFrame(raf);
  const m = document.getElementById("modal");
  document.getElementById("modalMsg").textContent = T[lang].nishad;
  document.getElementById("modalKilled").textContent = byNishad ? T[lang].killedN : T[lang].lost;
  m.style.display = "block";
}

/* ================= FLAPPY BIRD (shifin) ================= */
let bird, pipes, frame, ground = 440;
function initFlappy(){
  bird = { x:80, y:200, v:0, w:50, h:40 };
  pipes = []; frame = 0;
  for(let i=0;i<3;i++) pipes.push({ x:420 + i*200, gap:140, y:100 + Math.random()*180, passed:false });
}
function loop(){
  if(!running) return;
  ctx.clearRect(0,0,420,480);
  if(mode.type === "flappy") drawFlappy(); else drawDino();
  raf = requestAnimationFrame(loop);
}
function drawFlappy(){
  bird.v += 0.45; bird.y += bird.v;
  if(bird.y < 0){ bird.y = 0; bird.v = 0; }
  if(bird.y + bird.h > ground){ die(); return; }
  for(const p of pipes){
    p.x -= 3;
    if(p.x < -60){ p.x += 600; p.y = 100 + Math.random()*180; p.passed = false; }
    if(bird.x + bird.w > p.x && bird.x < p.x + 60){
      if(bird.y < p.y || bird.y + bird.h > p.y + p.gap){ die(); return; }
    }
    if(!p.passed && p.x + 60 < bird.x){
      p.passed = true; score += 10;
      sfx(mode.scoreS); /* shifinscore.mp3 — flappy-യിൽ മാത്രം */
      updateScore();
      if(score >= target){ win(); return; }
    }
    ctx.fillStyle = "#4caf50";
    ctx.fillRect(p.x, 0, 60, p.y);
    ctx.fillRect(p.x, p.y + p.gap, 60, ground - (p.y + p.gap));
  }
  ctx.fillStyle = "#8b5a2b"; ctx.fillRect(0, ground, 420, 40);
  ctx.drawImage(headImg, bird.x, bird.y, bird.w, bird.h);
}
function die(){ sfx(mode.hit); gameOver(false); }
function win(){
  running = false; cancelAnimationFrame(raf);
  const m = document.getElementById("modal");
  document.getElementById("modalMsg").textContent = T[lang].nishad;
  document.getElementById("modalKilled").textContent = T[lang].killedN;
  m.style.display = "block";
}

/* ================= DINO (shadin / ashmil) ================= */
let dino, obstacles, obTimer, nishadBird, darkBg;
function initDino(variant){
  dino = { x:50, y:340, v:0, w:55, h:55, onGround:true };
  obstacles = []; obTimer = 0; nishadBird = null; darkBg = variant;
}
function drawDino(){
  ctx.fillStyle = darkBg ? "#34495e" : "#f7f7f7";
  ctx.fillRect(0,0,420,480);
  ctx.fillStyle = darkBg ? "#2c3e50" : "#e0e0e0";
  ctx.fillRect(0, ground, 420, 40);
  dino.v += 0.8; dino.y += dino.v;
  if(dino.y > 340){ dino.y = 340; dino.v = 0; dino.onGround = true; }
  obTimer++;
  if(obTimer > 90){ obTimer = 0; obstacles.push({ x:430, y:365, w:35, h:40 }); }
  for(const o of obstacles){
    o.x -= 6;
    if(dino.x + dino.w > o.x && dino.x < o.x + o.w && dino.y + dino.h > o.y){ die(); return; }
    ctx.fillStyle = darkBg ? "#c0392b" : "#555";
    ctx.fillRect(o.x, o.y, o.w, o.h);
  }
  obstacles = obstacles.filter(o=>o.x > -50);
  /* score 100 എത്തുമ്പോൾ nishad bird വരും */
  if(score >= target - 10 && !nishadBird) nishadBird = { x:440, y:250 };
  if(nishadBird){
    nishadBird.x -= 5;
    if(nishadBird.x < -60) nishadBird.x = 440;
    ctx.drawImage(nishadImg, nishadBird.x, nishadBird.y, 55, 45);
    ctx.font = "bold 14px Arial"; ctx.fillStyle = darkBg ? "#fff" : "#000";
    ctx.fillText("Nishad", nishadBird.x + 8, nishadBird.y - 5);
    if(dino.x + dino.w > nishadBird.x && dino.x < nishadBird.x + 55 &&
       dino.y < nishadBird.y + 45 && dino.y + dino.h > nishadBird.y){
      sfx(mode.hit); gameOver(true); return; }
  }
  ctx.drawImage(headImg, dino.x, dino.y, dino.w, dino.h);
}

/* ================= INPUT ================= */
function doJump(){
  if(!running) return;
  if(mode.type === "flappy"){ bird.v = -8; sfx(mode.jump); }
  else if(dino.onGround){ dino.v = -14; dino.onGround = false; sfx(mode.jump); }
}
document.addEventListener("keydown", e=>{ if(e.code === "Space"){ e.preventDefault(); doJump(); } });
cv.addEventListener("mousedown", doJump);
cv.addEventListener("touchstart", e=>{ e.preventDefault(); doJump(); });
</script>
</body>
</html>
